<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Статус заявок</title>
</head>
<body>
  <h1>Заявки на кредит</h1>
  <table id="apps-table" border="1" cellpadding="5">
    <thead>
      <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Сумма</th>
        <th>Срок (мес)</th>
        <th>Статус</th>
        <th>Дата</th>
      </tr>
    </thead>
    <tbody id="apps-body"></tbody>
  </table>
  <br>
  <button onclick="loadApplications()">Обновить</button>

  <script>
    async function loadApplications() {
      const res = await fetch('/api/applications');
      const apps = await res.json();
      const body = document.getElementById('apps-body');
      body.innerHTML = apps.map(a =>
        '<tr id="row-' + a.id + '">' +
        '<td>' + a.id + '</td>' +
        '<td>' + a.name + '</td>' +
        '<td>' + a.amount + '</td>' +
        '<td>' + a.term + '</td>' +
        '<td>' +
        '<select onchange="updateStatus(' + a.id + ', this.value)">' +
          '<option value="в ожидании">в ожидании</option>' +
          '<option value="одобрено">одобрено</option>' +
          '<option value="отклонено">отклонено</option>' +
        '</select>' +
        '</td>' +
        '<td>' + a.created_at + '</td>' +
        '</tr>'
      ).join('');
      // set selects to current values
      apps.forEach(a => {
        const sel = document.querySelector('#row-' + a.id + ' select');
        if (sel) sel.value = a.status;
      });
    }

    async function updateStatus(id, status) {
      const res = await fetch('/api/applications/' + id + '/status', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      const app = await res.json();
      // re-render just this row to reflect server state
      const row = document.getElementById('row-' + id);
      if (row) {
        const sel = row.querySelector('select');
        if (sel) sel.value = app.status;
      }
    }

    loadApplications();
    setInterval(loadApplications, 10000);
  </script>
</body>
</html>
