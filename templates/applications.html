<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Статус заявок</title>
</head>
<body>
  <nav>
    <a href="/">Главная</a> |
    <a href="/apply">Подать заявку</a> |
    <a href="/applications">Статус заявок</a>
  </nav>
  <h1>Заявки на кредит</h1>
  <table id="apps-table" border="1" cellpadding="5">
    <thead>
      <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Сумма</th>
        <th>Срок (мес)</th>
        <th>Статус</th>
        <th>Дата</th>
      </tr>
    </thead>
    <tbody id="apps-body"></tbody>
  </table>
  <br>
  <button onclick="loadApplications()">Обновить</button>

  <script>
    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^|;)\\s*' + name + '\\s*=\s*([^;]+)'));
      return match ? match.pop() : null;
    }

    let currentAppId = getCookie('current_app_id');

    async function loadApplications() {
      const res = await fetch('/api/applications');
      const apps = await res.json();
      const body = document.getElementById('apps-body');
      body.innerHTML = apps.map(a =>
        '<tr id="row-' + a.id + '">' +
        '<td>' + a.id + '</td>' +
        '<td>' + a.name + '</td>' +
        '<td>' + a.amount + '</td>' +
        '<td>' + a.term + '</td>' +
        '<td>' + a.status + '</td>' +
        '<td>' + a.created_at + '</td>' +
        '</tr>'
      ).join('');
      // Check for cookie alert after loading
      if (currentAppId && currentAppId !== '') {
        const row = document.getElementById('row-' + currentAppId);
        if (row) {
          const statusCell = row.querySelector('td:nth-child(5)');
          if (statusCell && (statusCell.textContent === 'одобрено' || statusCell.textContent === 'отклонено')) {
            alert('Статус заявки #' + currentAppId + ' изменился на ' + statusCell.textContent + '.');
            document.cookie = 'current_app_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            currentAppId = null;
          }
        }
      }
    }

    loadApplications();
    setInterval(loadApplications, 10000);
  </script>
</body>
</html>
