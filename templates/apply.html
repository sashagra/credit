<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Подача заявки на кредит</title>
</head>
<body>
  <nav>
    <a href="/">Главная</a> |
    <a href="/apply">Подать заявку</a> |
    <a href="/applications">Статус заявок</a>
  </nav>
  <h1>Заявка на кредит</h1>
  <form id="credit-form">
    <label>
      Имя:
      <input type="text" name="name" required>
    </label>
    <br>
    <label>
      Сумма:
      <input type="number" step="0.01" name="amount" required>
    </label>
    <br>
    <label>
      Срок (мес):
      <input type="number" name="term" required>
    </label>
    <br>
    <button type="submit">Отправить</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('credit-form');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      const res = await fetch('/apply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      document.getElementById('result').innerHTML =
        '<p>Заявка #' + result.id + ' создана. Статус: ' + result.status + '</p>';
      form.reset();
    });
  </script>
</body>
</html>
